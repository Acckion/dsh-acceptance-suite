name: ci

on:
  push:
  pull_request:

jobs:
  monorepo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ts-monorepo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/python-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rust-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
